<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DM Impressão 3D — Catálogo</title>
  <meta name="description" content="Catálogo de produtos da DM Impressão 3D: peças decorativas e personalizadas impressas em 3D. Peça pelo WhatsApp.">
  <meta name="theme-color" content="#060404">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DM Impressão 3D — Catálogo">
  <meta property="og:description" content="Peças decorativas e personalizadas impressas em 3D. Veja os produtos e peça pelo WhatsApp.">
  <!-- Depois de publicar, troque pelo endereço final (veja o README): -->
  <meta property="og:image" content="https://dm-catalogo.vercel.app/assets/img/og.png">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="apple-touch-icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Lato:wght@400;700&family=Montserrat:wght@500;600;700&family=Raleway:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/catalog.css">
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>
    MODO DEMONSTRAÇÃO — os produtos abaixo são de exemplo. Configure o Supabase (veja o README) para usar o catálogo de verdade.
  </div>

  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <img id="brand-logo" src="assets/img/logo.png" alt="Logo DM Impressão 3D" width="64" height="64">
        <div>
          <h1 class="brand-name" id="brand-name">DM Impressão 3D</h1>
          <p class="brand-tag" id="brand-tag">Ideias ganham forma</p>
        </div>
      </div>
      <form class="search" role="search" onsubmit="return false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="q" class="sr-only">Buscar produto</label>
        <input id="q" type="search" placeholder="Buscar produto…" autocomplete="off" enterkeyhint="search">
        <button type="button" class="clear" id="q-clear" aria-label="Limpar busca" hidden>&times;</button>
      </form>
    </div>
  </header>

  <div class="chips-bar">
    <nav class="chips" id="chips" aria-label="Categorias"></nav>
  </div>

  <main>
    <p class="result-info" id="info" aria-live="polite"></p>
    <section class="grid" id="grid" aria-label="Produtos"></section>
    <div id="state"></div>
  </main>

  <footer>
    <strong id="foot-name">DM Impressão 3D</strong>
    Fale com a gente pelo WhatsApp para pedidos e peças personalizadas.
  </footer>

  <a class="fab hide" id="fab" href="#" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16.04 3C9.4 3 4 8.4 4 15.04c0 2.12.55 4.18 1.6 6L4 28l7.1-1.86a12 12 0 0 0 4.94 1.06C22.7 27.2 28 21.8 28 15.04 28 8.4 22.68 3 16.04 3zm0 22.1c-1.5 0-2.96-.4-4.24-1.16l-.3-.18-4.2 1.1 1.12-4.1-.2-.32a9.9 9.9 0 0 1-1.52-5.3c0-5.5 4.5-9.96 10.04-9.96 5.5 0 9.96 4.46 9.96 9.96 0 5.5-4.46 9.96-9.96 9.96zm5.46-7.46c-.3-.15-1.78-.88-2.06-.98-.28-.1-.48-.15-.68.15s-.78.98-.96 1.18c-.18.2-.35.22-.65.08-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.78-1.67-2.08-.18-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.68-1.64-.93-2.25-.24-.58-.49-.5-.68-.5h-.58c-.2 0-.53.08-.8.38s-1.05 1.03-1.05 2.5 1.08 2.9 1.23 3.1c.15.2 2.12 3.23 5.12 4.53.72.3 1.28.5 1.7.63.72.23 1.37.2 1.88.12.58-.08 1.78-.73 2.03-1.43.25-.7.25-1.3.18-1.43-.08-.12-.28-.2-.58-.35z"/></svg>
    <span>Falar no WhatsApp</span>
  </a>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/catalog.js"></script>
</body>
</html>
